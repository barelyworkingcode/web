<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found - Barely Working Code</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-xl);
        }
        .error-code {
            font-family: var(--font-mono);
            font-size: 8rem;
            font-weight: 700;
            color: var(--blue-600);
            line-height: 1;
            margin-bottom: var(--space-md);
        }
        .error-title {
            font-size: 1.5rem;
            color: var(--gray-900);
            margin-bottom: var(--space-md);
        }
        .error-message {
            color: var(--gray-500);
            max-width: 400px;
            margin-bottom: var(--space-2xl);
        }
        .error-terminal {
            background: var(--gray-900);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            text-align: left;
            margin-bottom: var(--space-2xl);
        }
        .error-terminal .line {
            color: var(--gray-400);
        }
        .error-terminal .prompt {
            color: var(--blue-400);
        }
        .error-terminal .error {
            color: var(--red);
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            Well, this is awkward. The page you're looking for doesn't exist.
            It might have worked at some point. Barely.
        </p>
        <div class="error-terminal">
            <div class="line"><span class="prompt">$</span> find /page -name "requested"</div>
            <div class="line error">Error: File not found</div>
            <div class="line"><span class="prompt">$</span> echo "Have you tried turning it off and on again?"</div>
        </div>
        <a href="/" class="btn btn-primary">Back to Home</a>
    </main>
</body>
</html>
