<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#eff6ff" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Blue accent bar -->
  <rect y="0" width="1200" height="8" fill="#2563eb"/>

  <!-- Terminal icon -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="140" height="100" rx="8" stroke="#2563eb" stroke-width="4" fill="#f8fafc"/>
    <path d="M30 40L55 60L30 80" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="70" y1="80" x2="110" y2="80" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="20" r="8" fill="#ef4444"/>
  </g>

  <!-- Main text -->
  <text x="280" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#1e293b">
    <tspan fill="#64748b">barely</tspan><tspan fill="#2563eb">working</tspan><tspan fill="#64748b">code</tspan>
  </text>

  <!-- Tagline -->
  <text x="280" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#64748b">
    It works! Barely.
  </text>

  <!-- URL -->
  <text x="100" y="570" font-family="ui-monospace, monospace" font-size="24" fill="#94a3b8">
    www.barelyworkingcode.com
  </text>
</svg>
